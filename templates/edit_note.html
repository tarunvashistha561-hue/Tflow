<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Digital Notebook — Edit your note." />
  <meta name="theme-color" content="#4F46E5" />
  <title>Edit Note — Tflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="page-form">

  <div id="app" class="app-shell form-shell">

    <!-- ── Header ──────────────────────────────────────────────────────────── -->
    <header class="app-header form-header" role="banner">
      <div class="header-inner">
        <a href="{{ url_for('index') }}" class="btn-back" aria-label="Back to notes">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </a>
        <h1 class="page-title">Edit Note</h1>
        <div class="header-actions">
          <span class="note-id-badge">ID #{{ note.id }}</span>
        </div>
      </div>
    </header>

    <!-- ── Form ────────────────────────────────────────────────────────────── -->
    <main class="main-content form-content" role="main">

      <!-- Original timestamps -->
      <div class="meta-strip">
        <span class="meta-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          Created: <time datetime="{{ note.created_at }}">{{ note.created_at }}</time>
        </span>
        <span class="meta-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Updated: <time id="updatedAtDisplay" datetime="{{ note.updated_at }}">{{ note.updated_at }}</time>
        </span>
      </div>

      <form id="editNoteForm" class="note-form" novalidate aria-label="Edit note form"
            data-note-id="{{ note.id }}">

        <!-- Title -->
        <div class="form-group" id="titleGroup">
          <label for="noteTitle" class="form-label">Title</label>
          <input
            type="text"
            id="noteTitle"
            name="title"
            class="form-input"
            value="{{ note.title }}"
            maxlength="200"
            autocomplete="off"
            aria-required="true"
            aria-describedby="titleError"
          />
          <span class="char-counter" id="titleCounter">{{ note.title | length }} / 200</span>
          <span class="form-error" id="titleError" role="alert" hidden></span>
        </div>

        <!-- Content -->
        <div class="form-group" id="contentGroup">
          <label for="noteContent" class="form-label">Content</label>
          <textarea
            id="noteContent"
            name="content"
            class="form-textarea"
            rows="12"
            aria-required="true"
            aria-describedby="contentError"
          >{{ note.content }}</textarea>
          <span class="form-error" id="contentError" role="alert" hidden></span>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <a href="{{ url_for('index') }}" class="btn btn-ghost" id="cancelBtn">Cancel</a>
          <button type="submit" class="btn btn-primary" id="updateBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
            Update Note
          </button>
        </div>

      </form>
    </main>

  </div>

  <!-- ══ Toast Notification ══════════════════════════════════════════════════ -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
