name: Build Tflow Capacitor APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repository ──────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ───────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 3. Set up JDK 17 (Required for Gradle/Android compilation) ─────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # ── 4. Install npm dependencies ─────────────────────────────────────
      - name: Install dependencies
        run: |
          npm ci || npm install

      # ── 5. Setup Capacitor Android Project ──────────────────────────────
      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      # ── 6. Build APK via Gradle ─────────────────────────────────────────
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      # ── 7. Upload compiled APK ──────────────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tflow-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
