name: Build Tflow Capacitor APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repository ──────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ───────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 3. Set up JDK 17 (Required for Gradle/Android compilation) ─────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # ── 4. Install npm dependencies ─────────────────────────────────────
      - name: Install dependencies
        run: |
          npm ci || npm install

      # ── 5. Setup Capacitor Android Project ──────────────────────────────
      - name: Initialize Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      # ── 5.5. Generate custom Tflow app launcher icons ─────────────────────
      - name: Generate App Launcher Icons
        run: |
          RES_DIR="android/app/src/main/res"
          
          resize_legacy() {
            local size=$1
            local folder=$2
            convert assets/logo.png -resize "${size}x${size}" "${RES_DIR}/${folder}/ic_launcher.png"
            convert assets/logo.png -resize "${size}x${size}" "${RES_DIR}/${folder}/ic_launcher_round.png"
          }
          
          resize_foreground() {
            local size=$1
            local folder=$2
            convert assets/logo.png -resize "${size}x${size}" "${RES_DIR}/${folder}/ic_launcher_foreground.png"
          }
          
          resize_legacy 48 "mipmap-mdpi"
          resize_legacy 72 "mipmap-hdpi"
          resize_legacy 96 "mipmap-xhdpi"
          resize_legacy 144 "mipmap-xxhdpi"
          resize_legacy 192 "mipmap-xxxhdpi"
          
          resize_foreground 108 "mipmap-mdpi"
          resize_foreground 162 "mipmap-hdpi"
          resize_foreground 216 "mipmap-xhdpi"
          resize_foreground 324 "mipmap-xxhdpi"
          resize_foreground 432 "mipmap-xxxhdpi"


      # ── 6. Build APK via Gradle ─────────────────────────────────────────
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      # ── 7. Upload compiled APK ──────────────────────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tflow-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
